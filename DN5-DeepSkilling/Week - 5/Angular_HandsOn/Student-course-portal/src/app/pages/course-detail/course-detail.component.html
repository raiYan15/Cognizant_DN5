<section class="detail">
  <a class="back-link" routerLink="/courses">&larr; Back to courses</a>

  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <div *ngIf="course$ | async as course" class="detail-card">
    <p class="eyebrow">Course details</p>
    <h2>{{ course.name }}</h2>
    <div class="meta-grid">
      <div>
        <span>Code</span>
        <strong>{{ course.code }}</strong>
      </div>
      <div>
        <span>Credits</span>
        <strong>{{ course.credits }}</strong>
      </div>
      <div>
        <span>Grade status</span>
        <strong>{{ course.gradeStatus }}</strong>
      </div>
    </div>
  </div>

  <div class="students-panel">
    <h3>Enrolled Students</h3>
    <ul>
      <li *ngFor="let s of students$ | async">
        <span>{{ s.name }}</span>
        <strong>{{ s.email }}</strong>
      </li>
    </ul>
  </div>
</section>
