<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 11.1 - Profile Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="card shadow-sm" style="width: 18rem;">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" class="card-img-top" alt="Profile Picture">
      <div class="card-body">
        <h5 class="card-title">Jane Doe</h5>
        <p class="card-text text-muted">Software Engineer specializing in frontend development and responsive web design.</p>
        <a href="#" class="btn btn-primary w-100">View Profile</a>
      </div>
    </div>
  </div>
</body>
</html>
