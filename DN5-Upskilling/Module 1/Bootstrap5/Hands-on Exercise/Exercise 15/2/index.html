<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15.2 - Shadows and Pill Badges</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="row g-4 justify-content-center">
      <div class="col-md-5">
        <div class="card shadow p-4 border-0">
          <div class="card-body">
            <span class="badge bg-primary rounded-pill mb-2 px-3 py-2">Regular Shadow</span>
            <h5 class="card-title mt-2">Card with .shadow</h5>
            <p class="card-text text-muted">This card features standard shadow and a rounded-pill badge.</p>
          </div>
        </div>
      </div>

      <div class="col-md-5">
        <div class="card shadow-lg p-4 border-0">
          <div class="card-body">
            <span class="badge bg-danger rounded-pill mb-2 px-3 py-2">Large Shadow</span>
            <h5 class="card-title mt-2">Card with .shadow-lg</h5>
            <p class="card-text text-muted">This card features a prominent large shadow and a rounded-pill badge.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
