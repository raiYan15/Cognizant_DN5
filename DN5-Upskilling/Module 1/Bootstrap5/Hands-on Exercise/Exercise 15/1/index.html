<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 15.1 - Image Borders and Rounded Corners</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5 text-center">
    <h2 class="mb-4">Image Border & Circle Styling</h2>
    <img 
      src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200&auto=format&fit=crop&q=80" 
      class="border border-primary border-3 rounded-circle" 
      width="180" 
      height="180" 
      alt="Circular Avatar"
    >
    <p class="mt-3 text-muted">Applied classes: border border-primary border-3 rounded-circle</p>
  </div>
</body>
</html>
