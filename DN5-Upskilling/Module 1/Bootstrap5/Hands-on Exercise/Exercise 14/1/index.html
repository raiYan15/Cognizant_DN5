<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 14.1 - Display and Visibility</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Responsive Display Classes</h2>

    <div class="d-none d-md-block p-3 bg-info-subtle border rounded mb-3">
      <strong>d-none d-md-block:</strong> Visible only on medium (tablet) screens and larger. Hidden on mobile.
    </div>

    <div class="d-block d-md-none p-3 bg-warning-subtle border rounded mb-3">
      <strong>d-block d-md-none:</strong> Visible only on mobile screens. Hidden on tablet and desktop.
    </div>

    <div class="d-none d-lg-flex justify-content-between p-3 bg-success-subtle border rounded">
      <span><strong>d-none d-lg-flex:</strong> Flexbox display active only on large screens and up.</span>
      <span class="badge bg-success">Desktop only</span>
    </div>
  </div>
</body>
</html>
