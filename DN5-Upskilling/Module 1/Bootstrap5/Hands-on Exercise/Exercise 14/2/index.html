<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 14.2 - Tablet and Desktop Sidebar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="row">
      <div class="d-none d-md-block col-md-3">
        <div class="p-3 bg-light border rounded">
          <h5>Tablet & Desktop Sidebar</h5>
          <p class="text-muted small">Hidden on mobile (d-none d-md-block)</p>
          <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link" href="#">Analytics</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Reports</a></li>
            <li class="nav-item"><a class="nav-link" href="#">Settings</a></li>
          </ul>
        </div>
      </div>

      <div class="col-12 col-md-9">
        <div class="p-4 bg-white border rounded">
          <h2>Main Content Area</h2>
          <p>On mobile screens (&lt; 768px), the sidebar disappears and this content takes full width.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
