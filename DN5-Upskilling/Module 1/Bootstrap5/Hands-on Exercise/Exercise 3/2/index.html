<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3.2 - Responsive Containers and Columns</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Responsive Grid with Container and Rows</h2>

    <div class="row g-3 mb-4">
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="p-3 bg-light border text-center">col-12 col-sm-6 col-lg-3</div>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="p-3 bg-light border text-center">col-12 col-sm-6 col-lg-3</div>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="p-3 bg-light border text-center">col-12 col-sm-6 col-lg-3</div>
      </div>
      <div class="col-12 col-sm-6 col-lg-3">
        <div class="p-3 bg-light border text-center">col-12 col-sm-6 col-lg-3</div>
      </div>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-8">
        <div class="p-3 bg-primary-subtle border text-center">col-12 col-md-8</div>
      </div>
      <div class="col-12 col-md-4">
        <div class="p-3 bg-secondary-subtle border text-center">col-12 col-md-4</div>
      </div>
    </div>
  </div>
</body>
</html>
