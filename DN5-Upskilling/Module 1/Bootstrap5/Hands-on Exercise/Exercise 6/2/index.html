<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6.2 - Card with Flex Alignment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="card shadow-sm" style="max-width: 450px;">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="card-title mb-0">Product Item</h5>
          <span class="badge bg-success">$49.99</span>
        </div>
        <p class="card-text text-muted">High quality product with premium features and responsive design layout.</p>
        <div class="d-flex justify-content-between align-items-center">
          <small class="text-muted">In Stock</small>
          <button class="btn btn-primary btn-sm">Buy Now</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
