<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 7.2 - Text Transformation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Text Transformation Utilities</h2>
    
    <p class="text-uppercase bg-light p-3 border">
      this text was lowercase and is now transformed to uppercase.
    </p>

    <p class="text-lowercase bg-light p-3 border">
      THIS TEXT WAS UPPERCASE AND IS NOW TRANSFORMED TO LOWERCASE.
    </p>

    <p class="text-capitalize bg-light p-3 border">
      this text has each word capitalized automatically using text-capitalize.
    </p>
  </div>
</body>
</html>
