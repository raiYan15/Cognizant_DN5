<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.2 - Four-Column Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Four Equal Columns (col-sm-3)</h2>
    <div class="row g-3">
      <div class="col-sm-3">
        <div class="p-3 bg-primary text-white text-center rounded">Column 1</div>
      </div>
      <div class="col-sm-3">
        <div class="p-3 bg-secondary text-white text-center rounded">Column 2</div>
      </div>
      <div class="col-sm-3">
        <div class="p-3 bg-success text-white text-center rounded">Column 3</div>
      </div>
      <div class="col-sm-3">
        <div class="p-3 bg-danger text-white text-center rounded">Column 4</div>
      </div>
    </div>
  </div>
</body>
</html>
