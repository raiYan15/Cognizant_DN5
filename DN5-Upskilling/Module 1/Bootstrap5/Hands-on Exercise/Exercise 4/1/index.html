<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4.1 - Sidebar and Content Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="row">
      <div class="col-12 col-md-3 mb-3 mb-md-0">
        <div class="p-3 bg-light border rounded">
          <h5>Sidebar (col-md-3)</h5>
          <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link px-0" href="#">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link px-0" href="#">Profile</a></li>
            <li class="nav-item"><a class="nav-link px-0" href="#">Settings</a></li>
          </ul>
        </div>
      </div>
      
      <div class="col-12 col-md-9">
        <div class="p-4 bg-white border rounded">
          <h2>Content Area (col-md-9)</h2>
          <p>This is the main content section that expands across 9 columns on medium screens and above.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
