<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 12.2 - Pricing Section</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <div class="text-center mb-5">
      <h1 class="display-5 fw-bold mb-3">Pricing Plans</h1>
      <p class="lead text-muted">Choose the plan that fits your business needs.</p>
    </div>

    <div class="row g-4 justify-content-center">
      <div class="col-md-4">
        <div class="card h-100 p-4 border shadow-sm text-center">
          <div class="card-body">
            <h4 class="card-title mb-4">Basic</h4>
            <h2 class="display-6 fw-bold mb-4">$9<span class="fs-6 text-muted">/mo</span></h2>
            <ul class="list-unstyled mb-4">
              <li class="py-2 border-bottom">10 Projects</li>
              <li class="py-2 border-bottom">5 GB Storage</li>
              <li class="py-2">Email Support</li>
            </ul>
            <button class="btn btn-outline-primary w-100 py-2">Get Started</button>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card h-100 p-4 border-primary shadow text-center">
          <div class="card-body">
            <h4 class="card-title text-primary mb-4">Pro</h4>
            <h2 class="display-6 fw-bold mb-4">$29<span class="fs-6 text-muted">/mo</span></h2>
            <ul class="list-unstyled mb-4">
              <li class="py-2 border-bottom">Unlimited Projects</li>
              <li class="py-2 border-bottom">50 GB Storage</li>
              <li class="py-2">Priority Support</li>
            </ul>
            <button class="btn btn-primary w-100 py-2">Get Started</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
