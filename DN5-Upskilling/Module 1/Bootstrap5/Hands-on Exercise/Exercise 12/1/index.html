<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 12.1 - Spacing Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <div class="m-3 p-2 bg-light border">
      <p class="mb-0">This element has margin m-3 and padding p-2.</p>
    </div>

    <div class="mt-4 py-5 bg-primary text-white text-center rounded">
      <h3>Element with mt-4 and py-5</h3>
      <p class="mb-0">Generous vertical padding applied with py-5 and top margin with mt-4.</p>
    </div>
  </div>
</body>
</html>
