<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 17.1 - Social Media Footer Icons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">
  <div class="container my-5 flex-grow-1">
    <h1>Page Content</h1>
    <p>This layout uses Bootstrap Icons in the footer below.</p>
  </div>

  <footer class="bg-dark text-white py-4 mt-auto text-center">
    <div class="container">
      <p class="mb-2">Follow us on social media</p>
      <div class="d-flex justify-content-center gap-3 fs-4">
        <a href="#" class="text-white"><i class="bi bi-facebook"></i></a>
        <a href="#" class="text-white"><i class="bi bi-twitter-x"></i></a>
        <a href="#" class="text-white"><i class="bi bi-instagram"></i></a>
        <a href="#" class="text-white"><i class="bi bi-linkedin"></i></a>
        <a href="#" class="text-white"><i class="bi bi-github"></i></a>
      </div>
    </div>
  </footer>
</body>
</html>
