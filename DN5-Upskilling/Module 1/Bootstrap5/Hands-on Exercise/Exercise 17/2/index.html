<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 17.2 - Icon Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Icon-Only Action Buttons</h2>

    <div class="d-flex gap-2">
      <button type="button" class="btn btn-primary" aria-label="Edit">
        <i class="bi bi-pencil-square"></i>
      </button>

      <button type="button" class="btn btn-danger" aria-label="Delete">
        <i class="bi bi-trash"></i>
      </button>

      <button type="button" class="btn btn-success" aria-label="Save">
        <i class="bi bi-check-lg"></i>
      </button>

      <button type="button" class="btn btn-warning" aria-label="Bookmark">
        <i class="bi bi-bookmark-star"></i>
      </button>

      <button type="button" class="btn btn-info" aria-label="Share">
        <i class="bi bi-share-fill"></i>
      </button>

      <button type="button" class="btn btn-secondary" aria-label="Settings">
        <i class="bi bi-gear-fill"></i>
      </button>
    </div>
  </div>
</body>
</html>
