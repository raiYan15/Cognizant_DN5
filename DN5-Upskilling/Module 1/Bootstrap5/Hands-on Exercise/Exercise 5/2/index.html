<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 5.2 - Column Reordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
    <h2 class="mb-4">Column Reordering with order-*</h2>
    <div class="row g-3">
      <div class="col-12 col-md-6 order-md-2">
        <div class="p-4 bg-info text-dark rounded">
          <h4>First in HTML (order-md-2)</h4>
          <p>Shows first on mobile, but appears second on medium screens and up.</p>
        </div>
      </div>
      <div class="col-12 col-md-6 order-md-1">
        <div class="p-4 bg-warning text-dark rounded">
          <h4>Second in HTML (order-md-1)</h4>
          <p>Shows second on mobile, but appears first on medium screens and up.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
