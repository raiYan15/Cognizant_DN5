<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 6 - Links and Lists Styling</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Local Community Event Portal</h1>
  </header>

  <nav>
    <ul class="nav-menu">
      <li><a href="#home">Home</a></li>
      <li><a href="#events">Events</a></li>
      <li><a href="#workshops">Workshops</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <main style="padding: 20px;">
    <ul class="event-list">
      <li>
        <strong>Photography Walk:</strong> Capture golden hour urban architecture. 
        <a href="#register-photo">Learn more</a>
      </li>
      <li>
        <strong>Pottery Workshop:</strong> Learn wheel throwing basics. 
        <a href="#register-pottery">Learn more</a>
      </li>
      <li>
        <strong>Local Chess Tournament:</strong> Open to all skill levels. 
        <a href="#register-chess">Learn more</a>
      </li>
    </ul>
  </main>
</body>
</html>
