<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 4 - Dynamic DOM Manipulation with jQuery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f8fafc;
    }
    .card {
      max-width: 480px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .form-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add { background: #2563eb; color: white; }
    .btn-clear { background: #ef4444; color: white; width: 100%; margin-top: 15px; }
    ul {
      padding-left: 20px;
      line-height: 1.8;
      margin-top: 15px;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="card">
    <h2>Community Event Todo List</h2>
    <form id="itemForm">
      <div class="form-group">
        <input type="text" id="itemInput" placeholder="Enter task or attendee name..." required>
        <button type="submit" class="btn-add">Add Item</button>
      </div>
    </form>

    <ul id="itemList">
      <li>Setup event registration desk</li>
      <li>Arrange sound system in auditorium</li>
    </ul>

    <button type="button" id="removeAllBtn" class="btn-clear">Remove All</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
