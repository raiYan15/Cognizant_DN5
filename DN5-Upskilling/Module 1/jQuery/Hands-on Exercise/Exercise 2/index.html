<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 2 - The $() Function</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f8fafc;
      text-align: center;
    }
    .card {
      max-width: 550px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    button {
      padding: 10px 20px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>Original Title (Before jQuery)</h1>
    <p>This is the first paragraph. It remains visible.</p>
    <p id="secondParagraph">This is the second paragraph. Click the button below to hide it.</p>
    <button id="hideBtn">Hide Second Paragraph</button>
  </div>

  <script src="main.js"></script>
</body>
</html>
